    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video and Smart Link Split View</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
        }
       
        .video-section {
            flex: 1;
            width: 100%;
            height: 50vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
    
        .smartlink-section {
            flex: 1;
            width: 100%;
            height: 50vh;
            background: #fff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>


    <div class="video-section">
        <video id="player" controls autoplay muted playsinline></video>
    </div>

  
    <div class="smartlink-section">
        <iframe id="smartLinkFrame"></iframe>
    </div>

    <script>
const params = new URLSearchParams(window.location.search);
const videoUrl = params.get("video");
const player = document.getElementById("player");
const smartLinkFrame = document.getElementById("smartLinkFrame");
const smartLink = "https://s.pemsrv.com/v1/link.php?cat=&idzone=5991674&type=8";

if (videoUrl) {
    player.src = videoUrl;
    player.play().catch(error => {
        console.log("Autoplay prevented:", error);
    });
} else {
    document.querySelector('.video-section').innerHTML = "<h2 style='color:white;text-align:center;'>No Video Found</h2>";
}

smartLinkFrame.src = smartLink;
    </script>
</body>
</html>
