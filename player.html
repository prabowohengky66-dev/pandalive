<title>Video Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    background:#000;
    overflow:hidden;
}

.video-section{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
}

video{
    width:100%;
    height:100%;
    object-fit:contain;
}

.no-video{
    color:#fff;
    font-size:24px;
}
</style>

</head>

<body>

<div class="video-section" id="videoSection">
    <video id="player"
        controls
        autoplay
        muted
        playsinline
        webkit-playsinline>
    </video>
</div>

<script>

const params=new URLSearchParams(location.search);

const rawVideo=params.get("video");

const player=document.getElementById("player");

const videoSection=document.getElementById("videoSection");

function noVideo(msg){
    videoSection.innerHTML="<div class='no-video'>"+msg+"</div>";
}

if(rawVideo){

    let url;

    try{
        url=decodeURIComponent(rawVideo);
    }catch(e){
        url=rawVideo;
    }

    player.src=url;

    player.play().catch(()=>{});

    player.onerror=function(){
        noVideo("Video failed");
    };

}else{

    noVideo("No Video Found");

}
</body>
