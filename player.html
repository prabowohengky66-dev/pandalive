    <title>Video Player with Auto Smart Link</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;

            height: 100%;

            height: 100vh;

        /* វីដេអូលេងពេញផ្ទាំង */

            height: 100%;

    <div class="main-container">

      <video id="player" controls autoplay muted playsinline></video>
