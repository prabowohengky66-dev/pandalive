<!DOCTYPE html>
<html lang="en">

    <!-- Basic Meta -->
    <meta charset="UTF-8">

    <title>Video Player</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        body {
            font-family: Arial, sans-serif;
        }

        .video-section {
            position: relative;
            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #000;
            overflow: hidden;
        }

        #player {
            display: block;

            width: 100%;
            height: 100%;

            background: #000;

            object-fit: contain;
        }

        .no-video {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            width: 100%;

            padding: 20px;

            color: #fff;

            font-size: 24px;
            font-weight: 500;

            text-align: center;
        }

        .loading {
            position: absolute;

            top: 50%;
            left: 50%;

            transform: translate(-50%, -50%);

            color: #fff;

            font-size: 18px;

            text-align: center;

            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 600px) {

            .no-video {
                font-size: 20px;
            }

            .loading {
                font-size: 16px;
            }

        }

    </style>

</head>

<body>

    <div
        class="video-section"
        id="videoSection"
    >

        <!-- Loading -->
        <div
            class="loading"
            id="loading"
        >
            Loading video...
        </div>

        <!-- Video -->
        <video
            id="player"
            controls
            autoplay
            muted
            playsinline
            webkit-playsinline
            preload="auto"
        ></video>

    </div>


    <script>

        /*
         * ============================
         * GET VIDEO FROM URL
         * ============================
         */

        const params = new URLSearchParams(
            window.location.search
        );

        const rawVideo = params.get("video");

        const player =
            document.getElementById("player");

        const videoSection =
            document.getElementById("videoSection");

        const loading =
            document.getElementById("loading");


        /*
         * ============================
         * SHOW MESSAGE
         * ============================
         */

        function showMessage(message) {

            loading.classList.add("hidden");

            player.classList.add("hidden");

            const oldMessage =
                videoSection.querySelector(".no-video");

            if (oldMessage) {
                oldMessage.remove();
            }

            const messageBox =
                document.createElement("div");

            messageBox.className =
                "no-video";

            messageBox.textContent =
                message;

            videoSection.appendChild(
                messageBox
            );
        }


        /*
         * ============================
         * DECODE VIDEO URL
         * ============================
         */

        function getVideoURL(value) {

            try {

                return decodeURIComponent(value);

            } catch (error) {

                return value;

            }

        }


        /*
         * ============================
         * VIDEO ERROR
         * ============================
         */

        player.addEventListener(
            "error",
            function () {

                showMessage(
                    "Video failed to load"
                );

            }
        );


        /*
         * ============================
         * VIDEO LOADED
         * ============================
         */

        player.addEventListener(
            "loadeddata",
            function () {

                loading.classList.add(
                    "hidden"
                );

            }
        );


        /*
         * ============================
         * CAN PLAY
         * ============================
         */

        player.addEventListener(
            "canplay",
            function () {

                loading.classList.add(
                    "hidden"
                );

            }
        );


        /*
         * ============================
         * PLAY VIDEO
         * ============================
         */

        async function startVideo() {

            try {

                await player.play();

            } catch (error) {

                /*
                 * Browser may block autoplay.
                 * User can press Play.
                 */

                console.log(
                    "Autoplay blocked:",
                    error
                );

            }

        }


        /*
         * ============================
         * CHECK VIDEO URL
         * ============================
         */

        if (!rawVideo) {

            showMessage(
                "No Video Found"
            );

        } else {

            const videoURL =
                getVideoURL(rawVideo);

            if (!videoURL) {

                showMessage(
                    "Invalid Video URL"
                );

            } else {

                /*
                 * Set video source
                 */

                player.src =
                    videoURL;

                /*
                 * Load video
                 */

                player.load();

                /*
                 * Try autoplay
                 */

                startVideo();

            }

        }


        /*
         * ============================
         * TRY PLAY AGAIN
         * ============================
         */

        document.addEventListener(
            "visibilitychange",
            function () {

                if (
                    document.visibilityState ===
                    "visible"
                ) {

                    if (
                        player.src &&
                        player.paused
                    ) {

                        startVideo();

                    }

                }

            }
        );


        /*
         * ============================
         * USER INTERACTION
         * ============================
         */

        document.addEventListener(
            "click",
            function () {

                if (
                    player.src &&
                    player.paused
                ) {

                    startVideo();

                }

            }
        );


        /*
         * ============================
         * KEYBOARD PLAY
         * ============================
         */

        document.addEventListener(
            "keydown",
            function (event) {

                if (
                    event.code === "Space"
                ) {

                    event.preventDefault();

                    if (player.paused) {

                        player.play();

                    } else {

                        player.pause();

                    }

                }

            }
        );

    </script>

</body>
</html>
